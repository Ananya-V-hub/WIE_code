<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CollabX Lite - Login</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg, #4b6cb7, #182848);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
    }

    .login-container {
        background: #fff;
        padding: 30px 25px;
        border-radius: 15px;
        width: 360px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        text-align: center;
    }

    .login-container h1 {
        margin-bottom: 20px;
        color: #4b6cb7;
        font-size: 28px;
    }

    input[type="email"], input[type="password"], select {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    .show-password {
        text-align: left;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .login-container button {
        width: 100%;
        padding: 12px;
        background-color: #4b6cb7;
        color: white;
        border: none;
        border-radius: 8px;
        margin-top: 10px;
        cursor: pointer;
        font-size: 16px;
    }

    .login-container button:hover {
        background-color: #182848;
    }

    .spinner {
        display: none;
        margin: 15px auto;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #4b6cb7;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg);}
        100% { transform: rotate(360deg);}
    }

    .error {
        color: red;
        font-size: 14px;
        text-align: left;
    }
</style>
</head>
<body>

<div class="login-container">
    <h1>CollabX Lite</h1>

    <input type="email" id="email" placeholder="Email">
    <div class="error" id="email-error"></div>

    <input type="password" id="password" placeholder="Password">
    <div class="show-password">
        <input type="checkbox" id="togglePassword"> Show Password
    </div>
    <div class="error" id="password-error"></div>

    <select id="userType">
        <option value="">Select User Type</option>
        <option value="student">Student</option>
        <option value="mentor">Mentor</option>
        <option value="admin">Admin</option>
    </select>
    <div class="error" id="type-error"></div>

    <button id="loginBtn">Login</button>
    <button id="registerBtn">Register</button>

    <div class="spinner" id="spinner"></div>
</div>

<script>
const API_BASE = "http://localhost:3000";

// Get elements
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const togglePassword = document.getElementById('togglePassword');
const loginBtn = document.getElementById('loginBtn');
const registerBtn = document.getElementById('registerBtn');
const spinner = document.getElementById('spinner');
const userType = document.getElementById('userType');

const emailError = document.getElementById('email-error');
const passwordError = document.getElementById('password-error');
const typeError = document.getElementById('type-error');

// Toggle password visibility
togglePassword.addEventListener('change', () => {
    passwordInput.type = togglePassword.checked ? "text" : "password";
});

// LOGIN FUNCTION
loginBtn.addEventListener('click', async () => {
    emailError.textContent = "";
    passwordError.textContent = "";
    typeError.textContent = "";

    let valid = true;

    if (!emailInput.value) {
        emailError.textContent = "Please enter email";
        valid = false;
    }

    if (!passwordInput.value || passwordInput.value.length < 6) {
        passwordError.textContent = "Password must be at least 6 characters";
        valid = false;
    }

    if (!userType.value) {
        typeError.textContent = "Please select user type";
        valid = false;
    }

    if (!valid) return;

    spinner.style.display = "block";

    try {
        const res = await fetch(`${API_BASE}/auth/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: emailInput.value,
                password: passwordInput.value
            })
        });

        const data = await res.json();
        spinner.style.display = "none";

        if (data.error) {
            alert("Invalid credentials");
        } else {
            localStorage.setItem("collabXUser", JSON.stringify(data.user));
            alert("Login successful!");
            window.location.href = "dashboard.html";
        }

    } catch (err) {
        console.error(err);
        spinner.style.display = "none";
        alert("Backend unreachable");
    }
});

// REGISTER FUNCTION
registerBtn.addEventListener('click', async () => {
    emailError.textContent = "";
    passwordError.textContent = "";
    typeError.textContent = "";

    let valid = true;

    if (!emailInput.value) {
        emailError.textContent = "Please enter email";
        valid = false;
    }
    if (!passwordInput.value || passwordInput.value.length < 6) {
        passwordError.textContent = "Password must be at least 6 characters";
        valid = false;
    }
    if (!userType.value) {
        typeError.textContent = "Please select user type";
        valid = false;
    }

    if (!valid) return;

    spinner.style.display = "block";

    try {
        const res = await fetch(`${API_BASE}/auth/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: emailInput.value.split("@")[0],
                email: emailInput.value,
                password: passwordInput.value,
                skills: [userType.value]
            })
        });

        const data = await res.json();
        spinner.style.display = "none";

        if (data.error) {
            alert(data.error);
        } else {
            alert("Registered Successfully!");
            localStorage.setItem("collabXUser", JSON.stringify(data.user));
            window.location.href = "dashboard.html";
        }

    } catch (err) {
        console.error(err);
        spinner.style.display = "none";
        alert("Registration failed");
    }
});
</script>

</body>
</html>
