<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login / Register - CollabX Lite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3ff;
            padding: 40px;
        }

        .container {
            width: 350px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #00000022;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0066ff;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            margin-top: 12px;
        }

        button:hover {
            background: #004ccd;
        }

        .switch {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        a {
            color: #0066ff;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Login</h2>

        <input type="email" id="loginEmail" placeholder="Email">
        <input type="password" id="loginPassword" placeholder="Password">
        <button onclick="alert('Login clicked (no backend yet)')">Login</button>

        <hr style="margin: 20px 0;">

        <h2>Register</h2>

        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email">
        <input type="password" id="regPassword" placeholder="Password">
        <input type="text" id="regSkills" placeholder="Skills (e.g. HTML, Java)">
        <button onclick="alert('Register clicked (no backend yet)')">Register</button>

        <div class="switch">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

</body>
</html>
