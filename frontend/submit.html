<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Submit Challenge - CollabX Lite</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef3ff;
            padding: 30px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px #00000022;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 12px;
            cursor: pointer;
        }

        button:hover {
            background: #004ccd;
        }

        a {
            text-decoration: none;
            color: #0066ff;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Submit New Challenge</h2>

        <input type="text" id="title" placeholder="Challenge Title">
        <textarea id="description" rows="5" placeholder="Describe your challenge/idea"></textarea>
        <input type="text" id="skills" placeholder="Required Skills (e.g., IoT, Java, ML)">
        
        <button onclick="alert('Challenge submitted (frontend only)')">Submit</button>

        <p style="text-align:center; margin-top:15px;">
            <a href="dashboard.html">← Back to Dashboard</a>
        </p>
    </div>

</body>
</html>
